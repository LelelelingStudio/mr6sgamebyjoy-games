const c=document.getElementById("game"),ctx=c.getContext("2d");
let W=innerWidth,H=innerHeight,DPR=1;
function resize(){DPR=Math.max(1,devicePixelRatio||1);W=innerWidth;H=innerHeight;c.width=W*DPR;c.height=H*DPR;c.style.width=W+"px";c.style.height=H+"px";ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener("resize",resize);resize();

const keys=new Set();
addEventListener("keydown",e=>{keys.add(e.key.toLowerCase());if([" ","arrowleft","arrowright","arrowup"].includes(e.key.toLowerCase()))e.preventDefault()});
addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));

const GROUND=440;
const p={x:90,y:GROUND-48,w:32,h:48,vx:0,vy:0,grounded:true,jumps:0};
let idx=0,L=LEVELS[0],deaths=0,camera=0,shake=0,red=0,won=false;

/* ====== 存档（由「了了了游」提供） ====== */
const SAVE_KEY="laoliu_map_save_v1";
function saveProgress(){
  try{localStorage.setItem(SAVE_KEY,JSON.stringify({idx,deaths,won}));}catch(e){}
}
function loadProgress(){
  try{
    const raw=localStorage.getItem(SAVE_KEY);
    if(!raw)return null;
    const d=JSON.parse(raw);
    if(d&&typeof d.idx==="number"&&d.idx>=0&&d.idx<LEVELS.length)return d;
  }catch(e){}
  return null;
}
function clearProgress(){try{localStorage.removeItem(SAVE_KEY);}catch(e){}}

function cloneLevel(src){
 return JSON.parse(JSON.stringify(src));
}
function loadLevel(n,show=true){
 idx=n; L=cloneLevel(LEVELS[idx]);
 p.x=90;p.y=GROUND-p.h;p.vx=0;p.vy=0;p.grounded=true;p.jumps=0;camera=0;
 if(show){
   const el=document.getElementById("next");
   el.textContent=(idx===0?"🚪 第一关开始":`🚪 ${L.name}`);
   el.classList.remove("show");void el.offsetWidth;el.classList.add("show");
 }
 document.getElementById("levelName").textContent=L.name;
 saveProgress();
}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}

function die(){
 deaths++;document.getElementById("deaths").textContent=deaths;
 red=1;shake=18;
 const words=["哈哈！中招了！","老六机关启动！","就这？再来一次！","嘿嘿，被阴到了！","再来一次试试！"];
 const t=document.getElementById("toast");t.textContent=words[(deaths-1)%words.length];
 t.classList.remove("show");void t.offsetWidth;t.classList.add("show");
 for(const s of L.spikes){s.armed=false;s.active=false;s.delay=0;}
 p.x=90;p.y=GROUND-p.h;p.vx=0;p.vy=0;p.grounded=true;p.jumps=0;p._jumpHeld=false;camera=0;
 saveProgress();
}

function update(dt){
 if(won)return;
 const left=keys.has("a")||keys.has("arrowleft"),right=keys.has("d")||keys.has("arrowright");
 if(left)p.vx-=.65;if(right)p.vx+=.65;if(!left&&!right)p.vx*=.78;
 p.vx=Math.max(-6,Math.min(6,p.vx));
 const jump=keys.has("w")||keys.has("arrowup")||keys.has(" ");
 if(jump&&!p._jumpHeld){
   if(p.grounded){
     p.vy=-12.5;
     p.grounded=false;
     p.jumps=1;
   }else if(p.jumps<2){
     p.vy=-11.5;
     p.jumps=2;
   }
 }
 p._jumpHeld=jump;

 const oldBottom=p.y+p.h;
 p.vy+=.55;p.x+=p.vx;p.y+=p.vy;p.grounded=false;

 for(const s of L.safe){
   const overlap=p.x+p.w>s.x&&p.x<s.x+s.w;
   const crossed=oldBottom<=GROUND&&p.y+p.h>=GROUND;
   if(overlap&&crossed&&p.vy>=0){
     p.y=GROUND-p.h;p.vy=0;p.grounded=true;p.jumps=0;
   }
 }

 for(const s of L.spikes){
   if(!s.armed&&p.x+p.w>s.x&&p.x<s.x+s.w&&p.y+p.h>=GROUND-3){
     s.armed=true;s.delay=.10;
   }
   if(s.armed&&!s.active){s.delay-=dt;if(s.delay<=0)s.active=true}

   const baseBox={x:s.x+10,y:GROUND-s.h,w:s.w-20,h:s.h};
   if(hit(p,baseBox)){die();return}

   if(s.active){
     const fullBox={x:s.x+10,y:GROUND-s.maxH,w:s.w-20,h:s.maxH};
     if(hit(p,fullBox)){die();return}
   }
 }

 if(p.y>GROUND+120){die();return}

 p.x=Math.max(0,Math.min(L.width-p.w,p.x));

 const door={x:L.door.x,y:GROUND-L.door.h,w:L.door.w,h:L.door.h};
 if(hit(p,door)){
   if(idx+1<LEVELS.length){loadLevel(idx+1,true);return}
   won=true;document.getElementById("win").style.display="grid";
   clearProgress();
 }

 camera+=(p.x-W*.35-camera)*.08;
 camera=Math.max(0,Math.min(Math.max(0,L.width-W),camera));
 shake*=.86;red*=.9;
}

function draw(){
 ctx.save();
 if(shake>0)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);

 const theme=L.theme;
 const sky=ctx.createLinearGradient(0,0,0,H);
 const palettes=[
  ["#75d5ff","#eefaff"],["#a99bff","#ffe4c4"],["#ffd26e","#ffe8a7"],
  ["#76e0b2","#e7fff3"],["#ff8fa3","#fff0f4"]
 ];
 sky.addColorStop(0,palettes[theme][0]);sky.addColorStop(1,palettes[theme][1]);
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

 ctx.save();ctx.translate(-camera,0);
 ctx.fillStyle=["#78b77d","#8c76b5","#c69d55","#63a883","#c56e83"][theme];
 for(let x=-100;x<L.width+300;x+=230){ctx.beginPath();ctx.arc(x,GROUND+20,145,Math.PI,0);ctx.fill()}

 for(const s of L.safe){
   ctx.fillStyle="#4b5563";ctx.fillRect(s.x,GROUND,s.w,80);
   ctx.fillStyle=["#70b34e","#82b34f","#c9a84d","#64aa72","#c56f76"][theme];
   ctx.fillRect(s.x,GROUND,s.w,10);
 }

 for(const pit of L.pits){
   ctx.fillStyle="#20242d";ctx.fillRect(pit.x,GROUND,pit.w,250);
   ctx.fillStyle="#10131a";ctx.fillRect(pit.x+8,GROUND+8,Math.max(0,pit.w-16),220);
 }

 for(const s of L.spikes){
   const h=s.active?s.maxH:s.h;
   const count=7;ctx.fillStyle="#edf2f7";
   for(let i=0;i<count;i++){
     const x=s.x+i*s.w/count,b=s.w/count;
     ctx.beginPath();ctx.moveTo(x,GROUND);ctx.lineTo(x+b/2,GROUND-h);ctx.lineTo(x+b,GROUND);ctx.closePath();ctx.fill();
     ctx.strokeStyle="#77828e";ctx.stroke();
   }
 }

 ctx.fillStyle="#ffca28";ctx.fillRect(Math.max(10,p.x-130),350,135,52);
 ctx.fillStyle="#222";ctx.font="bold 18px Arial";
 ctx.fillText("二段跳 · 碰到才死",Math.max(18,p.x-122),382);

 ctx.fillStyle="#6b4226";ctx.fillRect(L.door.x,GROUND-L.door.h,L.door.w,L.door.h);
 ctx.fillStyle="#ffd75a";ctx.beginPath();ctx.arc(L.door.x+45,GROUND-L.door.h+43,5,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#fff";ctx.font="bold 18px Arial";ctx.fillText("下一关",L.door.x-2,GROUND-L.door.h-10);

 ctx.fillStyle=red>.05?"#ff2b2b":"#2468d8";ctx.fillRect(p.x,p.y,p.w,p.h);
 ctx.fillStyle="#ffd2ad";ctx.beginPath();ctx.arc(p.x+16,p.y+12,11,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#111";ctx.fillRect(p.x+8,p.y+9,4,4);ctx.fillRect(p.x+21,p.y+9,4,4);

 ctx.restore();ctx.restore();

 if(red>.02){ctx.fillStyle="rgba(255,0,0,"+Math.min(.30,red*.30)+")";ctx.fillRect(0,0,W,H)}
}

let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}

/* 启动：优先读存档 */
const _saved=loadProgress();
if(_saved&&!_saved.won){
  deaths=_saved.deaths||0;
  document.getElementById("deaths").textContent=deaths;
  loadLevel(_saved.idx,true);
}else{
  loadLevel(0,false);
}

/* 清档按钮 */
document.getElementById("resetSave").addEventListener("click",e=>{
  e.preventDefault();
  if(confirm("确定清除存档吗？将从第 1 关重新开始。")){
    clearProgress();
    location.reload();
  }
});

loop(last);
</script>
